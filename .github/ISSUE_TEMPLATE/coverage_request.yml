name: Coverage Request
description: Request a new instance type or region (AWS, Azure, GCP)
labels: ["coverage"]
body:
  - type: markdown
    attributes:
      value: |
        Coverage extensions are the fastest PRs to merge. If you can supply the TDP data and grid intensity, we can usually turn this around quickly.

  - type: dropdown
    id: type
    attributes:
      label: What are you requesting?
      options:
        - New instance type
        - New region
        - Both
    validations:
      required: true

  - type: input
    id: instance
    attributes:
      label: Instance type (if applicable)
      placeholder: "e.g., c5.9xlarge, Standard_D16s_v3, n2-standard-16"

  - type: input
    id: region
    attributes:
      label: Region (if applicable)
      placeholder: "e.g., ap-northeast-1, westeurope, europe-west1"

  - type: textarea
    id: data
    attributes:
      label: Source data (TDP bounds / grid intensity)
      description: >
        Link to Cloud Carbon Footprint's CURRENT coefficient data
        (github.com/cloud-carbon-footprint/ccf-coefficients — NOT the older,
        archived cloud-carbon-coefficients repo) or Electricity Maps data if
        you have it. Requesting AWS Graviton, Azure Ampere (Dpsv5), or GCP T2A
        coverage? See METHODOLOGY.md's Known Limitations first — these were
        deliberately removed because no real, independently-sourced power data
        exists for any ARM cloud chip in CCF's data, old or new. A request for
        one of these needs a genuinely new source, not a re-derivation from
        the same CCF data already checked.

  - type: textarea
    id: context
    attributes:
      label: Why do you need this?
      description: Helps us prioritise. What are you running that we don't currently support?
